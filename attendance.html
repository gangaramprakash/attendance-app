<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website with login and registration form | codingstella</title>
    <link rel="stylesheet" href="style.css">
    <!-- Added Chart.js Library so your graph works -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    
    
    
    <div class="wrapper" style="overflow-y: auto; max-height: 90vh;">
        <span class="icon-close"><ion-icon name="close"></ion-icon></span>
        <div class="form-box login">
            <h2>Attendance Calculator</h2>
            <form action="#" onsubmit="event.preventDefault(); calculate();">
                <div class="input-box">
                    
                     <input type="number" id="total" placeholder="Total Classes" required>
                </div>
                <div class="input-box">
                   
                    <input type="number" id="attended" placeholder="Attended Classes" required>
                </div>
                <div class="input-box" style="margin-bottom: 15px;">
                    <input type="number" id="bunkDays" placeholder="Enter days you want to bunk (optional)">
                </div>
                
                <button type="submit">Calculate</button>
                
                <!-- ADDED: The Install App button that was missing -->
                <button type="button" id="installBtn" style="display: none; margin-top: 10px; background: #fff; color: #333;">Install App</button>
                
                <!-- ADDED: Container for your calculation results -->
                <div id="result" style="margin-top: 20px; line-height: 1.5; font-size: 14px;"></div>
                
                <!-- ADDED: Canvas for your Chart.js graph -->
                <canvas id="chart" style="margin-top: 20px; max-width: 100%;"></canvas>
            </form>
        </div>
    </div>

<script>
let chart;

// WORKING DAYS FUNCTION (SKIP SUNDAYS)
function addWorkingDays(startDate, daysToAdd) {
    let date = new Date(startDate);
    let addedDays = 0;

    while (addedDays < daysToAdd) {
        date.setDate(date.getDate() + 1);
        if (date.getDay() !== 0) { // skip Sunday
            addedDays++;
        }
    }
    return date;
}

function calculate() {
    let total = parseInt(document.getElementById("total").value);
    let attended = parseInt(document.getElementById("attended").value);

    if (isNaN(total) || isNaN(attended) || total <= 0 || attended > total) {
        alert("⚠️ Please enter valid inputs! (Attended cannot be greater than Total)");
        return;
    }

    // ADDED: Actually save the data to localStorage so it loads next time!
    localStorage.setItem("total", total);
    localStorage.setItem("attended", attended);

    let bunkInput = parseInt(document.getElementById("bunkDays").value);
    let bunkResult = "";

    if (!isNaN(bunkInput) && bunkInput > 0) {
        let newTotal = total + (6 * bunkInput);
        let newPercentage = (attended / newTotal) * 100;

        bunkResult = `<br><br><b>📉 If you bunk ${bunkInput} days:</b><br>
                      New Attendance: ${newPercentage.toFixed(2)}%`;

        let recoveryClasses = 0;
        while (true) {
            let future = ((attended + recoveryClasses) / (newTotal + recoveryClasses)) * 100;
            if (future >= 75) break;
            recoveryClasses++;
        }

        let recoveryDays = (recoveryClasses / 6).toFixed(2);
        bunkResult += `<br><b>To recover 75%:</b><br>Classes: ${recoveryClasses}<br>Days: ${recoveryDays}`;
    }

    let percentage = (attended / total) * 100;
    let day1 = ((attended + 6) / (total + 6)) * 100;
    let day10 = ((attended + 60) / (total + 60)) * 100;

    let days = 0;
    while (true) {
        let future = ((attended + 6*days) / (total + 6*days)) * 100;
        if (future >= 75) break;
        days++;
    }

    let classesNeeded = days * 6;
    let reachText = (percentage >= 75) ? "Already above 75% 😎" : `${days} days (${classesNeeded} classes)`;

    let today = new Date();
    let targetDate = addWorkingDays(today, days);
    let options = { day: 'numeric', month: 'long', year: 'numeric' };
    let finalDate = targetDate.toLocaleDateString('en-IN', options);

    let bunk = 0;
    while (true) {
        let future = (attended / (total + 6*bunk)) * 100;
        if (future < 75) break;
        bunk++;
    }

    let maxSafeBunk = Math.max(0, bunk - 1);
    let maxSafeClasses = maxSafeBunk * 6;

    let absentTotal = total + 6;
    let absentPercentage = (attended / absentTotal) * 100;

    let absentClasses = 0;
    while (true) {
        let future = ((attended + absentClasses) / (absentTotal + absentClasses)) * 100;
        if (future >= 75) break;
        absentClasses++;
    }

    let absentDays = (absentClasses / 6).toFixed(2);

    let warning = "";
    if (percentage < 75) {
        warning = "⚠️ Bro attend classes 😅 you're below 75%!";
    } else if (percentage < 80) {
        warning = "🙂 Safe but don’t bunk too much!";
    } else {
        warning = "😎 Chill bro, you're in safe zone!";
    }

    // OUTPUT
    document.getElementById("result").innerHTML =
    `<b>Current:</b> ${percentage.toFixed(2)}%<br>
     <b>After 1 Day (Present):</b> ${day1.toFixed(2)}%<br>
     <b>After 10 Days:</b> ${day10.toFixed(2)}%<br>
     <b>To Reach 75%:</b> ${reachText}<br>
     <b>📅 Target Date:</b> ${finalDate}<br>
     <b>🧠 Max Safe Bunk:</b> ${maxSafeBunk} days (${maxSafeClasses} classes)<br>
     <hr style="margin: 10px 0;">
     <b>❌ If Absent Today:</b><br>
     <b>New Attendance:</b> ${absentPercentage.toFixed(2)}%<br>
     <b>To Recover:</b> ${absentDays} days (${absentClasses} classes)<br><br>
     <b>${warning}</b>` + bunkResult;

    // GRAPH
    let daysArr = [];
    let percentArr = [];

    for (let i = 0; i <= 30; i++) {
        let future = ((attended + 6*i) / (total + 6*i)) * 100;
        daysArr.push(i);
        percentArr.push(future.toFixed(2));
    }

    if (chart) chart.destroy();

    let ctx = document.getElementById('chart').getContext('2d');
    
    // Set text color to white if you have a dark background
    Chart.defaults.color = '#fff'; 

    chart = new Chart(ctx, {
        type: 'line',
        data: {
            labels: daysArr,
            datasets: [{
                label: 'Attendance %',
                data: percentArr,
                borderColor: '#0ef', // Neon blue color to match typical codingstella themes
                backgroundColor: 'rgba(0, 238, 255, 0.2)',
                borderWidth: 2,
                fill: true
            }]
        },
        options: {
            scales: {
                y: { beginAtZero: false }
            }
        }
    });
}

// Ensure code runs only on HTTP/HTTPS to prevent file:// protocol errors
if (window.location.protocol !== "file:") {
    if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("service-worker.js").catch(err => console.log("SW failed:", err));
    }
} else {
    console.warn("Service Workers cannot be registered on file:/// URLs. Please use Live Server.");
}

let deferredPrompt;
window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredPrompt = e;
    document.getElementById("installBtn").style.display = "block";
});

document.getElementById("installBtn").addEventListener("click", async () => {
    if (deferredPrompt) {
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        if (outcome === "accepted") console.log("User installed the app");
        deferredPrompt = null;
        document.getElementById("installBtn").style.display = "none";
    }
});

// LOAD SAVED DATA
window.onload = function() {
    let savedTotal = localStorage.getItem("total");
    let savedAttended = localStorage.getItem("attended");

    if (savedTotal && savedAttended) {
        document.getElementById("total").value = savedTotal;
        document.getElementById("attended").value = savedAttended;
    }
};
</script>

<script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
<script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
    
</body>
</html>
