<!DOCTYPE html>
<html>
<head>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-CSFW4EDXTX"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-CSFW4EDXTX');
</script>
    <link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#00c6ff">
    <title>Smart Attendance App</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
    body{
    margin:0;
    font-family:'Segoe UI',sans-serif;
    background:linear-gradient(135deg,#4facfe,#00f2fe);

    display:flex;
    justify-content:center;
    align-items:center;

    min-height:100vh;
}

.box{
    width:90%;
    max-width:850px;

    background:white;
    color:#333;

    border-radius:20px;
    padding:30px;

    box-shadow:0 15px 35px rgba(0,0,0,.25);
}

h1{
    margin:0;
    color:#3f51b5;
}

p{
    color:#777;
}

input{
    width:100%;
    padding:14px;
    margin:12px 0;

    border-radius:10px;
    border:1px solid #ccc;

    font-size:16px;
    box-sizing:border-box;
}

input:focus{
    outline:none;
    border-color:#3f51b5;
}

button{
    width:100%;
    padding:14px;

    background:#3f51b5;
    color:white;

    border:none;
    border-radius:10px;

    font-size:18px;
    cursor:pointer;
  transition:.3s;
}

button:hover{
    background:#283593;
    transform:scale(1.02);
}

.result-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:20px;
    margin-top:25px;
}

.card{
    background:#f5f7fa;
    border-radius:15px;
    padding:20px;
    text-align:center;
    box-shadow:0 5px 15px rgba(0,0,0,0.1);
}
canvas{
    width:100%!important;
    height:350px!important;
    margin-top:20px;
}
        .progress{
    width:100%;
    height:18px;
    background:#ddd;
    border-radius:10px;
    overflow:hidden;
    margin:15px 0;
}

#bar{
    height:100%;
    width:0%;
    background:linear-gradient(to right,#00c853,#64dd17);
    transition:1s;
}
        .box{
    animation:fade .6s ease;
}

@keyframes fade{
    from{
        opacity:0;
        transform:translateY(30px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}
    </style>
</head>

<body>

<div class="box">
    <button id="installBtn" style="display:none; margin-top:10px;">
    📲 Install App
</button>
  <div class="header">
    <h1>📚 Smart Attendance Predictor</h1>
    <p>Track • Predict • Stay Above 75%</p>
</div>

    <input type="number" id="total" placeholder="Total Classes">
    <input type="number" id="attended" placeholder="Attended Classes">
    <input type="number" id="bunkDays" placeholder="Enter days you want to bunk">

    <button onclick="calculate()">Calculate</button>

    <div id="result"></div>

    <canvas id="chart"></canvas>
</div>
<div class="progress">
    <div id="bar"></div>
</div>
<script>
let chart;

// ✅ WORKING DAYS FUNCTION (SKIP SUNDAYS)
function addWorkingDays(startDate, daysToAdd) {
    let date = new Date(startDate);
    let addedDays = 0;

    while (addedDays < daysToAdd) {
        date.setDate(date.getDate() + 1);

        if (date.getDay() !== 0) { // skip Sunday
            addedDays++;
        }
    }
    return date;
}

function calculate() {
    gtag('event', 'calculate_clicked', {
  event_category: 'button',
  event_label: 'calculate'
});
    let total = parseInt(document.getElementById("total").value);
    let attended = parseInt(document.getElementById("attended").value);

    if (isNaN(total) || isNaN(attended) || total <= 0 || attended > total) {
        alert("⚠️ Please enter valid inputs!");
        return;
    }

    // ✅ MOVE BUNK FEATURE HERE (CORRECT PLACE)
   // ✅ CUSTOM BUNK FEATURE
let bunkInput = parseInt(document.getElementById("bunkDays").value);
let bunkResult = "";

if (!isNaN(bunkInput) && bunkInput >= 0) {
    let newTotal = total + (6 * bunkInput);
    let newPercentage = (attended / newTotal) * 100;

    bunkResult = `<br><br><b>📉 If you bunk ${bunkInput} days:</b><br>
                  New Attendance: ${newPercentage.toFixed(2)}%`;

    // 🔥 RECOVERY AFTER BUNK (CORRECT PLACE)
   let recoveryClasses = 0;

while (true) {
    let future = ((attended + recoveryClasses) / (newTotal + recoveryClasses)) * 100;
    if (future >= 75) break;
    recoveryClasses++;
}

// convert to days (optional)
let recoveryDays = (recoveryClasses / 6).toFixed(2);

   bunkResult += `<br><b>To reach 75% again:</b><br>
Classes: ${recoveryClasses}<br>
Days: ${(recoveryClasses / 6).toFixed(2)}`;
}
    // 🔥 EXACT BUNK ALLOWED (CLASS LEVEL)
let bunkClasses = 0;

while (true) {
    let future = (attended / (total + bunkClasses)) * 100;
    if (future < 75) break;
    bunkClasses++;
}

// exact safe bunk
let safeBunkClasses = bunkClasses - 1;
let safeBunkDays = (safeBunkClasses / 6).toFixed(2);
    // ✅ ADD THIS BLOCK (MISSING LOGIC)

let percentage = (attended / total) * 100;

let day1 = ((attended + 6) / (total + 6)) * 100;
let day10 = ((attended + 60) / (total + 60)) * 100;

// Days to reach 75%
let exactClasses = 0;

while (true) {
    let future = ((attended + exactClasses) / (total + exactClasses)) * 100;
    if (future >= 75) break;
    exactClasses++;
}

let exactDays = (exactClasses / 6).toFixed(2);

let reachText = "";
if (percentage >= 75) {
    reachText = "Already above 75% 😎";
} else {
    reachText = `Classes: ${exactClasses} | Days: ${exactDays}`;
}

// Working date
let today = new Date();
let targetDate = addWorkingDays(today, Math.ceil(exactClasses / 6));

let options = { day: 'numeric', month: 'long', year: 'numeric' };
let finalDate = targetDate.toLocaleDateString('en-IN', options);


    // Absent
    let absentTotal = total + 6;
    let absentPercentage = (attended / absentTotal) * 100;

   let absentClasses = 0;

while (true) {
    let future = ((attended + absentClasses) / (absentTotal + absentClasses)) * 100;
    if (future >= 75) break;
    absentClasses++;
}

let absentDays = (absentClasses / 6).toFixed(2);

    // Warning
    let warning = "";
    if (percentage < 75) {
        warning = "⚠️ Bro attend classes 😅 you're below 75%!";
    } else if (percentage < 80) {
        warning = "🙂 Safe but don’t bunk too much!";
    } else {
        warning = "😎 Chill bro, you're in safe zone!";
    }

    // OUTPUT
    document.getElementById("result").innerHTML =
    `<b>Current:</b> ${percentage.toFixed(2)}%<br>
     <b>After 1 Day (Present):</b> ${day1.toFixed(2)}%<br>
     <b>After 10 Days:</b> ${day10.toFixed(2)}%<br>
    <b>To Reach 75%:</b><br>
Classes: ${exactClasses}<br>
Days: ${exactDays}<br>
     <b>📅 Target Date:</b> ${finalDate}<br>
   <b>Bunk Allowed:</b><br>
Classes: ${safeBunkClasses}<br>
Days: ${safeBunkDays}<br>
    

     <hr>

     <b>❌ If Absent Today:</b><br>
     <b>New Attendance:</b> ${absentPercentage.toFixed(2)}%<br>
     <b>To Recover:</b> ${absentDays} days (${absentClasses} classes)<br><br>

     <b>${warning}</b>`
    + bunkResult;
    // GRAPH (unchanged)
    let daysArr = [];
    let percentArr = [];

    for (let i = 0; i <= 30; i++) {
        let future = ((attended + 6*i) / (total + 6*i)) * 100;
        daysArr.push(i);
        percentArr.push(future.toFixed(2));
    }

    if (chart) chart.destroy();

    let ctx = document.getElementById('chart').getContext('2d');
    chart = new Chart(ctx, {
        type: 'line',
        data: {
            labels: daysArr,
            datasets: [{
                label: 'Attendance %',
                data: percentArr,
                borderWidth: 2
            }]
        }
    });
}
if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("service-worker.js");
}
    let deferredPrompt;

window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredPrompt = e;

    // Show install button
    document.getElementById("installBtn").style.display = "block";
});

// When user clicks install
document.getElementById("installBtn").addEventListener("click", async () => {
    if (deferredPrompt) {
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;

        if (outcome === "accepted") {
            console.log("User installed the app");
        }

        deferredPrompt = null;
    }
});
    // 🔄 LOAD SAVED DATA
window.onload = function() {
    let savedTotal = localStorage.getItem("total");
    let savedAttended = localStorage.getItem("attended");

    if (savedTotal && savedAttended) {
        document.getElementById("total").value = savedTotal;
        document.getElementById("attended").value = savedAttended;
    }
};
    document.getElementById("bar").style.width = percentage + "%";
</script>

</body>
</html>
