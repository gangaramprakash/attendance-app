<!DOCTYPE html>
<html>
<head>
    <link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#00c6ff">
    <title>Smart Attendance App</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        body {
            font-family: 'Segoe UI';
            background: #121212;
            color: white;
            text-align: center;
            padding: 40px;
        }

        .box {
            background: #1e1e1e;
            padding: 25px;
            border-radius: 15px;
            width: 340px;
            margin: auto;
            box-shadow: 0 0 15px rgba(0,0,0,0.5);
        }

        input {
            width: 90%;
            padding: 10px;
            margin: 10px;
            border-radius: 8px;
            border: none;
        }

        button {
            padding: 10px 20px;
            background: #00c6ff;
            color: black;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        #result {
            margin-top: 15px;
            text-align: left;
        }

        canvas {
            margin-top: 20px;
        }
    </style>
</head>

<body>

<div class="box">
    <button id="installBtn" style="display:none; margin-top:10px;">
    📲 Install App
</button>
    <h2>📊 Smart Attendance</h2>

    <input type="number" id="total" placeholder="Total Classes">
    <input type="number" id="attended" placeholder="Attended Classes">

    <button onclick="calculate()">Calculate</button>

    <div id="result"></div>

    <canvas id="chart"></canvas>
</div>

<script>
let chart;

// ✅ WORKING DAYS FUNCTION (SKIP SUNDAYS)
function addWorkingDays(startDate, daysToAdd) {
    let date = new Date(startDate);
    let addedDays = 0;

    while (addedDays < daysToAdd) {
        date.setDate(date.getDate() + 1);

        if (date.getDay() !== 0) { // skip Sunday
            addedDays++;
        }
    }
    return date;
}

function calculate() {
    let total = parseInt(document.getElementById("total").value);
    let attended = parseInt(document.getElementById("attended").value);

    if (isNaN(total) || isNaN(attended) || total <= 0 || attended > total) {
        alert("⚠️ Please enter valid inputs!");
        return;
    }

    let percentage = (attended / total) * 100;

    let day1 = ((attended + 6) / (total + 6)) * 100;
    let day10 = ((attended + 60) / (total + 60)) * 100;

    // Days to reach 75%
    let days = 0;
    while (true) {
        let future = ((attended + 6*days) / (total + 6*days)) * 100;
        if (future >= 75) break;
        days++;
    }

    let classesNeeded = days * 6;

    let reachText = "";
    if (percentage >= 75) {
        reachText = "Already above 75% 😎";
    } else {
        reachText = `${days} days (${classesNeeded} classes)`;
    }

    // 📅 Working Date Calculation
    let today = new Date();
    let targetDate = addWorkingDays(today, days);

    let options = { day: 'numeric', month: 'long', year: 'numeric' };
    let finalDate = targetDate.toLocaleDateString('en-IN', options);

    // Bunk days
    let bunk = 0;
    while (true) {
        let future = (attended / (total + 6*bunk)) * 100;
        if (future < 75) break;
        bunk++;
    }

    // ❌ Absent Today Feature
    let absentTotal = total + 6;
    let absentPercentage = (attended / absentTotal) * 100;

    let absentDays = 0;
    while (true) {
        let future = ((attended + 6*absentDays) / (absentTotal + 6*absentDays)) * 100;
        if (future >= 75) break;
        absentDays++;
    }

    let absentClasses = absentDays * 6;

    // 😄 SWEET WARNINGS
    let warning = "";
    if (percentage < 75) {
        warning = "⚠️ Bro attend classes 😅 you're below 75%!";
    } else if (percentage < 80) {
        warning = "🙂 Safe but don’t bunk too much!";
    } else {
        warning = "😎 Chill bro, you're in safe zone!";
    }

    // OUTPUT
    document.getElementById("result").innerHTML =
        `<b>Current:</b> ${percentage.toFixed(2)}%<br>
         <b>After 1 Day (Present):</b> ${day1.toFixed(2)}%<br>
         <b>After 10 Days:</b> ${day10.toFixed(2)}%<br>
         <b>To Reach 75%:</b> ${reachText}<br>
         <b>📅 Target Date:</b> ${finalDate}<br>
         <b>Bunk Allowed:</b> ${bunk - 1} days<br><br>

         <hr>

         <b>❌ If Absent Today:</b><br>
         <b>New Attendance:</b> ${absentPercentage.toFixed(2)}%<br>
         <b>To Recover:</b> ${absentDays} days (${absentClasses} classes)<br><br>

         <b>${warning}</b>`;

    // GRAPH
    let daysArr = [];
    let percentArr = [];

    for (let i = 0; i <= 30; i++) {
        let future = ((attended + 6*i) / (total + 6*i)) * 100;
        daysArr.push(i);
        percentArr.push(future.toFixed(2));
    }

    if (chart) chart.destroy();

    let ctx = document.getElementById('chart').getContext('2d');
    chart = new Chart(ctx, {
        type: 'line',
        data: {
            labels: daysArr,
            datasets: [{
                label: 'Attendance %',
                data: percentArr,
                borderWidth: 2
            }]
        }
    });
}
if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("service-worker.js");
}
</script>

</body>
</html>
